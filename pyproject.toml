[project]
name = "litkit"
version = "0.1.0"
description = "卒業研究用 文献研究支援システム"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "pymupdf>=1.25",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "rich>=13.9",
]

[project.scripts]
litkit = "litkit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/litkit"]
